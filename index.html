<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albanian Flashcards</title>

<style>

:root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1f2937;
    --border:#d1d5db;
    --blue:#2563eb;
    --green:#16a34a;
    --red:#dc2626;
}

@media (prefers-color-scheme: dark){

    :root{

        --bg:#111827;
        --card:#1f2937;
        --text:#f9fafb;
        --border:#374151;

    }
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:20px;

    background:var(--bg);
    color:var(--text);

    font-family:-apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    display:flex;
    justify-content:center;

}

.container{

    width:100%;
    max-width:700px;

}

h1{

    text-align:center;

}

.panel{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:20px;

    margin-bottom:20px;

}

input,
select{

    width:100%;

    margin-top:10px;

    padding:12px;

    border-radius:8px;

    border:1px solid var(--border);

    font-size:16px;

}

button{

    border:none;

    border-radius:10px;

    padding:14px;

    font-size:16px;

    cursor:pointer;

}

.primary{

    width:100%;

    margin-top:10px;

    background:var(--blue);

    color:white;

}

.controls{

    display:flex;

    gap:10px;

    margin-top:15px;

}

.know{

    flex:1;

    background:var(--green);

    color:white;

}

.again{

    flex:1;

    background:var(--red);

    color:white;

}

.card{

    background:var(--card);

    border:2px solid var(--border);

    border-radius:18px;

    min-height:250px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:25px;

    cursor:pointer;

    user-select:none;

}

.word{

    font-size:2rem;

    font-weight:600;

    line-height:1.5;

    word-break:break-word;

}

.stats{

    text-align:center;

    margin-top:20px;

    font-weight:600;

}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>📚 Albanian Flashcards</h1>

<div class="panel">

    <input
        type="file"
        id="csvFile"
        accept=".csv,text/csv"
    >

    <select id="lessonFilter">
        <option value="all">
            All Lessons
        </option>
    </select>

    <button
        class="primary"
        onclick="loadCSV()"
    >
        Load Flashcards
    </button>

</div>

<div
    id="studyArea"
    class="hidden"
>

    <div
        class="card"
        onclick="flipCard()"
    >

        <div
            id="cardText"
            class="word"
        >
            Load a CSV file
        </div>

    </div>

    <div class="controls">

        <button
            class="again"
            onclick="studyAgain(event)"
        >
            ❌ Study Again
        </button>

        <button
            class="know"
            onclick="knowCard(event)"
        >
            ✅ Know It
        </button>

    </div>

    <div
        id="progress"
        class="stats"
    ></div>

</div>

</div>

<script>

let allCards = [];
let cards = [];

let currentIndex = 0;
let showingAnswer = false;

let known = 0;
let reviewed = 0;

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [array[i],array[j]] =
        [array[j],array[i]];
    }
}

function parseCSV(text){

    const rows = [];
    const lines =
        text.split(/\r?\n/);

    for(const line of lines){

        if(!line.trim()) continue;

        const cols = [];

        let current = "";
        let inQuotes = false;

        for(let i=0;i<line.length;i++){

            const char = line[i];

            if(char === '"'){

                if(
                    inQuotes &&
                    i+1 < line.length &&
                    line[i+1] === '"'
                ){
                    current += '"';
                    i++;
                }
                else{

                    inQuotes = !inQuotes;

                }

            }
            else if(
                char === ',' &&
                !inQuotes
            ){

                cols.push(current.trim());
                current = "";

            }
            else{

                current += char;

            }
        }

        cols.push(current.trim());

        rows.push(cols);
    }

    const result = [];

    for(let i=1;i<rows.length;i++){

        const row = rows[i];

        if(row.length < 3)
            continue;

        const albanian =
            row[0];

        const english =
            row[1];

        const lesson =
            row[2];

        if(
            albanian &&
            english &&
            lesson
        ){

            result.push({

                albanian: albanian,

                english: english,

                lesson: lesson

            });

        }
    }

    return result;
}

function populateLessons(){

    const dropdown =
        document.getElementById(
            "lessonFilter"
        );

    dropdown.innerHTML =
        '<option value="all">All Lessons</option>';

    const lessons =
    [...new Set(
        allCards.map(
            c => c.lesson
        )
    )];

    lessons.sort(
        (a,b)=>
        Number(a)-Number(b)
    );

    lessons.forEach(lesson=>{

        const option =
            document.createElement(
                "option"
            );

        option.value =
            lesson;

        option.textContent =
            "Lesson " + lesson;

        dropdown.appendChild(
            option
        );

    });
}

function loadCSV(){

    const input =
        document.getElementById(
            "csvFile"
        );

    if(!input.files.length){

        alert(
            "Please select a CSV file."
        );

        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        allCards =
            parseCSV(
                e.target.result
            );

        if(
            allCards.length === 0
        ){

            alert(
                "No flashcards found."
            );

            return;
        }

        populateLessons();

        startSession();

    };

    reader.readAsText(
        input.files[0],
        "UTF-8"
    );
}

document
.getElementById(
    "lessonFilter"
)
.addEventListener(
    "change",
    ()=>{
        if(
            allCards.length > 0
        ){
            startSession();
        }
    }
);

function startSession(){

    const lesson =
        document
        .getElementById(
            "lessonFilter"
        )
        .value;

    if(
        lesson === "all"
    ){

        cards =
            [...allCards];

    }
    else{

        cards =
            allCards.filter(
                c =>
                c.lesson === lesson
            );

    }

    shuffle(cards);

    currentIndex = 0;
    known = 0;
    reviewed = 0;

    showingAnswer = false;

    document
    .getElementById(
        "studyArea"
    )
    .classList.remove(
        "hidden"
    );

    renderCard();
}

function renderCard(){

    if(cards.length===0){

        document
        .getElementById(
            "cardText"
        )
        .textContent =
        "No cards found.";

        return;
    }

    if(
        currentIndex >= cards.length
    ){

        shuffle(cards);

        currentIndex = 0;

    }

    showingAnswer = false;

    document
    .getElementById(
        "cardText"
    )
    .textContent =
    cards[currentIndex]
    .albanian;

    updateStats();
}

function flipCard(){

    if(cards.length===0) return;

    const card =
        cards[currentIndex];

    const display =
        document.getElementById(
            "cardText"
        );

    if(showingAnswer){

        display.textContent =
            card.albanian;

    }
    else{

        display.textContent =
            card.english;

    }

    showingAnswer =
        !showingAnswer;
}

function knowCard(event){

    event.stopPropagation();

    known++;
    reviewed++;

    currentIndex++;

    renderCard();
}

function studyAgain(event){

    event.stopPropagation();

    reviewed++;

    cards.push(
        cards[currentIndex]
    );

    currentIndex++;

    renderCard();
}

function updateStats(){

    const percent =
        reviewed === 0
        ? 0
        : Math.round(
            known /
            reviewed *
            100
        );

    document
    .getElementById(
        "progress"
    )
    .innerHTML =

    "Cards: " +
    cards.length +

    "<br>" +

    "Reviewed: " +
    reviewed +

    "<br>" +

    "Known: " +
    known +

    "<br>" +

    "Score: " +
    percent +
    "%";
}

</script>

</body>
</html>
